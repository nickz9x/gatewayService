server:
  port: 8079

spring:
  application:
    name: gatewayService

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identityService
              uri: http://identity-service:8080
              predicates:
                - Path=/api/auth/**

            - id: assetMarketDataServiceStocks
              uri: http://assetmarketdata-service:8082
              predicates:
                - Path=/api/stock/**
              filters:
                - TokenRelay


            - id: assetMarketDataServiceCrypto
              uri: http://assetmarketdata-service:8082
              predicates:
                - Path=/api/currency/**
              filters:
                - TokenRelay


            - id: portfolioService
              uri: http://portfolio-service:8087
              predicates:
                - Path=/api/portfolio/**
              filters:
                - TokenRelay


            - id: portfolioServiceAlerts
              uri: http://portfolio-service:8087
              predicates:
                - Path=/api/alert/**
              filters:
                - TokenRelay


            - id: notificationService
              uri: http://notification-service:8086
              predicates:
                - Path=/api/notification/**
              filters:
                - TokenRelay


            - id: identityServiceBot
              uri: http://identity-service:8080
              predicates:
                - Path=/api/bot/auth/**
              filters:
                - TokenRelay

            - id: portfolioServiceBotAlert
              uri: http://portfolio-service:8087
              predicates:
                - Path=/api/bot/alert/**
              filters:
                - TokenRelay

            - id: portfolioServiceBotPortfolio
              uri: http://portfolio-service:8087
              predicates:
                - Path=/api/bot/portfolio/**
              filters:
                - TokenRelay

            - id: openApiAssetMarketData
              uri: http://assetmarketdata-service:8082
              predicates:
                - Path=/docs/asset/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

            - id: openApiIdentity
              uri: http://identity-service:8080
              predicates:
                - Path=/docs/identity/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

            - id: openApiPortfolio
              uri: http://portfolio-service:8087
              predicates:
                - Path=/docs/portfolio/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: gateway-client
            client-secret: "YolMJpQk6hL5cQbnfM7K3P9REvKsi96fYoK7G50Yc9YBH1DvnrKsDjvZiR1WSzIXgMd0hmop2zYGOWKSoBGkal"
            authorization-grant-type: authorization_code
            scope: openid, profile, offline_access
        provider:
          keycloak:
            issuer-uri: http://keycloak:8080/realms/ChainTracker
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/ChainTracker

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha
    urls:
      - name: assetMarketDataService
        url: /docs/asset/v3/api-docs
      - name: identity-service
        url: /docs/identity/v3/api-docs
      - name: portfolioService
        url: /docs/portfolio/v3/api-docs
